{% extends "base.html" %}
{% block title %}{{ category_name }} — JUZ40{% endblock %}
{% block content %}

<div class="page-head">
  <div>
    <a class="back-link" href="{{ url_for('index') }}">← Басты бет</a>
    <h1>{{ category_name }}</h1>
    <p class="muted">Бағдарламаны таңдаңыз.</p>
  </div>
</div>

<div class="nav-cards">
  {% for program in programs %}
  <a class="nav-card" href="{{ url_for('program_detail', slug=program['slug']) }}#{{ category_slug }}">
    <img class="nav-card-ic" src="{{ url_for('static', filename='img/juz40-logo.png') }}" alt="">
    <div class="nav-card-title">{{ program['name'] }}</div>
  </a>
  {% endfor %}
</div>

{% endblock %}
