<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кіру — JUZ40</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="login-shell">
    <div class="login-panel">
      <form method="post" class="login-form">
        <div class="login-brand">JUZ40 · Апталық анализ</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-stack">
              {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <input type="hidden" name="next" value="{{ next }}">
        <label>
          Email
          <input type="email" name="email" required autofocus placeholder="admin@juz40.kz">
        </label>
        <label>
          Құпия сөз
          <input type="password" name="password" required placeholder="••••••••">
        </label>
        <button type="submit" class="btn btn-primary login-submit">Кіру</button>
      </form>
    </div>
    <div class="login-visual" aria-hidden="true"></div>
  </main>
</body>
</html>
