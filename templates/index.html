{% extends "base.html" %}
{% block title %}Бөлімдер — JUZ40{% endblock %}
{% block content %}

<div class="centered-head">
  <h1>Бөлім</h1>
  <p class="muted">Бөлімді таңдаңыз</p>
</div>

<div class="nav-cards">
  {% for cslug, clabel in sidebar_categories %}
  <a class="nav-card" href="{{ url_for('category_picker', category_slug=cslug) }}">
    <div class="nav-card-title">{{ clabel }}</div>
  </a>
  {% endfor %}
</div>

{% endblock %}
