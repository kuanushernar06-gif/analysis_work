{% extends "base.html" %}
{% block title %}Бағдарламалар — JUZ40{% endblock %}
{% block content %}

<div class="centered-head">
  <h1>Бөлім</h1>
  <p class="muted">Бөлімді таңдаңыз</p>
</div>

<div class="nav-cards">
  {% for item in programs %}
  <a class="nav-card" href="{{ url_for('program_detail', slug=item.program['slug']) }}">
    <span class="nav-card-ic">🎓</span>
    <div class="nav-card-title">{{ item.program['name'] }}</div>
  </a>
  {% endfor %}
</div>

{% endblock %}
